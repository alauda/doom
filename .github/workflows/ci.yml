name: CI

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Build and Lint with Node.js ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24
        os:
          - ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install Dependencies
        run: yarn --immutable

      - name: Install Playwright Browsers
        if: ${{ matrix.node != 24 }}
        timeout-minutes: 10
        run: yarn workspace @alauda/doom-export playwright install

      # Playwright browser extraction can hang under Node.js 24.
      - name: Setup Node.js 22 for Playwright Browser Install
        if: ${{ matrix.node == 24 }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Playwright Browsers with Node.js 22
        if: ${{ matrix.node == 24 }}
        timeout-minutes: 10
        run: yarn workspace @alauda/doom-export playwright install

      - name: Restore Node.js ${{ matrix.node }}
        if: ${{ matrix.node == 24 }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Build, Lint and Test
        run: |
          yarn build
          yarn run-p docs lint test typecov
        env:
          PARSER_NO_WATCH: true
          RAW_TERMS_URL: ${{ vars.RAW_TERMS_URL }}

      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          use_oidc: true
