name: GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Dependencies
        run: yarn --immutable

      # Playwright browser extraction can hang under Node.js 24.
      - name: Setup Node.js 22 for Playwright Browser Install
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Playwright Browsers with Node.js 22
        timeout-minutes: 10
        run: yarn workspace @alauda/doom-export playwright install

      - name: Restore Node.js LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Build and Export
        run: |
          yarn build
          # export the docs as pdf first
          yarn docs:build -e
          yarn docs:export
          tempdir=$(mktemp -d)
          # copy the pdf to the tempdir
          cp -r ./dist/*.pdf $tempdir
          # then build the docs with pdf download link
          yarn docs:build -a -d -R -S
          # copy the pdf back to the dist folder
          cp -r $tempdir/*.pdf ./dist
          # remove the tempdir
          rm -rf $tempdir

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: doom.js.org
          full_commit_message: ${{ github.event.head_commit.message }}
